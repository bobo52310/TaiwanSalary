name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        if: ${{ hashFiles('**/*.sh') != '' }}
        run: |
          shellcheck --version
          shellcheck $(git ls-files '*.sh')

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install (Node)
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint (Node)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run lint --if-present

      - name: Build (Node)
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build --if-present

